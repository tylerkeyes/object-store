syntax = "proto3";

package storage_node;

service StorageNodeService {
  rpc WriteChunk(WriteChunkRequest) returns (WriteChunkResponse);
  rpc ReadChunk(ReadChunkRequest) returns (ReadChunkResponse);
  rpc DeleteChunk(DeleteChunkRequest) returns (DeleteChunkResponse);
  rpc GetFreeChunks(GetFreeChunksRequest) returns (GetFreeChunksResponse);
  rpc GetChunkSize(GetChunkSizeRequest) returns (GetChunkSizeResponse);
  rpc CheckHealth(CheckHealthRequest) returns (CheckHealthResponse);
}

message WriteChunkRequest {
  uint64 chunk_id = 1;
  bytes chunk_bytes = 2;
}
message WriteChunkResponse { uint64 chunk_id = 1; }

message ReadChunkRequest { uint64 chunk_id = 1; }
message ReadChunkResponse {
  uint64 chunk_id = 1; // We probably don't need this in the response, but I
                       // think its good to include it.
  bytes chunk_bytes = 2;
  uint32 checksum = 3;
}

message DeleteChunkRequest { uint64 chunk_id = 1; }
message DeleteChunkResponse { uint64 chunk_id = 1; }

message GetFreeChunksRequest {}
message GetFreeChunksResponse { uint64 num_free = 1; }

message GetChunkSizeRequest {}
message GetChunkSizeResponse { uint64 chunk_size = 1; }

message CheckHealthRequest {}
message CheckHealthResponse { bool healthy = 1; }
