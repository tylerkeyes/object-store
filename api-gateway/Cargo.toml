[package]
name = "api-gateway"
version = "0.1.0"
edition = "2024"

[features]
tracing = ["dep:tracing", "dep:tracing-subscriber"]

default = ["tracing"]

[dependencies]
async-trait = "0.1"
axum = { version = "0.8.7", features = ["multipart"] }
base64 = "0.22.1"
crc32fast = "1.5.0"
async-stream = "0.3"
futures = "0.3"

opentelemetry = "0.31.0"
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31.0", features = ["trace", "grpc-tonic"] }

prost = "0.13"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.48.0", features = ["full"] }
tonic = "0.12"
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["timeout", "trace", "util", "sensitive-headers", "compression-gzip", "set-header"] }
tracing = { version = "0.1.41", features = ["std"], optional = true }
tracing-opentelemetry = "0.32.0"
tracing-subscriber = { version = "0.3.20", features = [
    "env-filter",
    "registry",
    "std",
    "fmt",
    "json",
], optional = true }
prost-types = "0.13"
storage-proto-lib = { path = "../protos" }
prometheus-client = "0.24.0"
serde_json = "1.0"

[dev-dependencies]
tokio-test = "0.4"
tower = { version = "0.5.2", features = ["util"] }
hyper = "1.0"
http-body-util = "0.1"
